# Vexryzer visitor-facing overlay for DeepSeek Harness 0.1.5-rc.1.
# Apply only over the upstream sdk-minimal profile.
# This file is configuration candidate material, not runtime-activation evidence.
# Effective composition must still be proved with dsh --dump-config before activation.

- id: llm-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: https://api.deepseek.com
    thinking: enabled
    reasoningEffort: high
    defaultContextWindow: 1000000
    models:
      - id: deepseek-v4-pro
        name: DeepSeek-V4-Pro
        contextWindow: 1000000
    streamIdleTimeoutMs: 12000
    retryPolicy:
      mode: normal
      maxRetries: 1
      retryableCodes:
        - RATE_LIMIT
        - SERVER
        - TIMEOUT
        - TRANSPORT
      backoff:
        initialDelayMs: 250
        maxDelayMs: 1000
        jitterRatio: 0

- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    personaPrefix: >-
      You are the bounded Vexryzer agent runtime. Application-supplied role
      instructions, canonical context, deterministic calculations, revision
      authority, tool schemas, and tool results are authoritative. Never claim
      filesystem, shell, code-execution, pricing, persistence, provenance, or
      canonical-truth authority that the application has not granted.

# Disable every sdk-minimal execution surface that a visitor-facing agent
# must never receive. These are id-targeted overrides; upstream composition
# semantics apply the later overlay over the shipped rows.
- id: sandbox
  disabled: true

- id: sandbox-policy
  disabled: true

- id: subprocess
  disabled: true

- id: pty
  disabled: true

- id: terminal-bash
  disabled: true

- id: terminal-pwsh
  disabled: true

- id: jobs
  disabled: true

- id: persistent-bash
  disabled: true

- id: persistent-pwsh
  disabled: true

# These provider-side metadata contributions are unnecessary for the
# visitor-facing Vexryzer runtime and are disabled to minimize external data.
- id: session-log-deepseek
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true
