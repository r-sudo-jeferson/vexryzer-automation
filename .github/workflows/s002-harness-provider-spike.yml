name: S002 Harness Provider Spike

on:
  push:
    branches:
      - slice/vxa-s002-ask-ai-adaptive-experience
    paths:
      - .github/workflows/s002-harness-provider-spike.yml
      - .github/workflows/s002-harness-mistral-spike.yml
      - job/tools/workshop-spike/provider-*.ts
      - job/tools/workshop-spike/harness-timeout-evidence.ts
      - job/tools/workshop-spike/run-provider-screen.mjs
      - job/tools/workshop-spike/run-harness-provider.mjs
      - job/tests/pure/workshop-multiprovider.node.test.ts
      - job/tests/pure/workshop-opencode.node.test.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s002-harness-provider-spike-${{ github.ref }}
  cancel-in-progress: false

jobs:
  free-tier-agent-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: s002-spike

    steps:
      - name: Checkout exact checkpoint
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: 11.25.0
          runtime: node@24
          package-json-file: job/package.json
          install: false
          cache: false

      - name: Record non-secret checkpoint facts
        shell: bash
        run: |
          set -euo pipefail
          node --version
          pnpm --version
          git rev-parse HEAD

      - name: Verify multiprovider pure contracts
        working-directory: job
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/pure/workshop-provider-contract.node.test.ts \
            tests/pure/workshop-harness-evidence.node.test.ts \
            tests/pure/workshop-spike-config.node.test.ts \
            tests/pure/workshop-harness-probe-path.node.test.mjs \
            tests/pure/workshop-persistence-evidence.node.test.ts \
            tests/pure/workshop-multiprovider.node.test.ts \
            tests/pure/workshop-opencode.node.test.ts

      - name: Verify protected free-tier credential presence
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN GROQ_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "missing protected credential reference: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Screen free-tier provider protocols
        working-directory: job
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p test-results
          result_file="test-results/s002-provider-screen.json"
          node tools/workshop-spike/run-provider-screen.mjs > "$result_file"
          cat "$result_file"

      - name: Prove real agent behavior through DeepSeek Harness
        id: harness
        working-directory: job
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p test-results
          result_file="test-results/s002-harness-provider-spike.json"
          set +e
          node tools/workshop-spike/run-harness-provider.mjs > "$result_file"
          status=$?
          set -e
          cat "$result_file"
          exit "$status"

      - name: Upload bounded provider and agent evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: s002-harness-provider-spike-${{ github.sha }}
          path: |
            job/test-results/s002-provider-screen.json
            job/test-results/s002-harness-provider-spike.json
          if-no-files-found: warn
          retention-days: 3
