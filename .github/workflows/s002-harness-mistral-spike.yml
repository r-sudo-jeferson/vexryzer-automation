name: S002 Harness Mistral Spike

on:
  push:
    branches:
      - slice/vxa-s002-ask-ai-adaptive-experience
    paths:
      - .github/workflows/s002-harness-mistral-spike.yml
      - job/tools/workshop-spike/**
      - job/tests/pure/workshop-*.node.test.ts
      - job/tests/pure/workshop-*.node.test.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s002-harness-mistral-spike-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harness-mistral-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: s002-spike

    steps:
      - name: Checkout exact checkpoint
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: 11.25.0
          runtime: node@24
          package-json-file: job/package.json
          install: false
          cache: false

      - name: Record non-secret checkpoint facts
        shell: bash
        run: |
          set -euo pipefail
          node --version
          pnpm --version
          git rev-parse HEAD

      - name: Verify spike pure contracts
        working-directory: job
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/pure/workshop-provider-contract.node.test.ts \
            tests/pure/workshop-harness-evidence.node.test.ts \
            tests/pure/workshop-spike-config.node.test.ts \
            tests/pure/workshop-model-battery.node.test.ts \
            tests/pure/workshop-harness-probe-path.node.test.mjs \
            tests/pure/workshop-persistence-evidence.node.test.ts

      - name: Run credentialed Harness plus Mistral compatibility gate
        id: compatibility
        working-directory: job
        shell: bash
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          VXA_MISTRAL_MODEL_ID: ministral-14b-2512
        run: |
          set -euo pipefail
          mkdir -p test-results
          result_file="test-results/s002-harness-mistral-spike.json"

          if [ -z "${MISTRAL_API_KEY:-}" ]; then
            printf '%s\n' '{"schemaVersion":1,"status":"error","compatible":false,"phase":"credential-preflight","error":{"name":"MissingCredential","message":"MISTRAL_API_KEY is not available from GitHub environment s002-spike"}}' > "$result_file"
            cat "$result_file"
            exit 1
          fi

          set +e
          node tools/workshop-spike/run-harness-mistral.mjs > "$result_file"
          status=$?
          set -e

          node --input-type=module - "$result_file" "$VXA_MISTRAL_MODEL_ID" <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const [file, model] = process.argv.slice(2);
          const result = JSON.parse(await readFile(file, 'utf8'));
          result.modelId ??= model;
          if (Array.isArray(result.notes)) {
            result.notes = result.notes.filter((note) => !String(note).includes('fixed Medium 3.5 id'));
          }
          await writeFile(file, `${JSON.stringify(result, null, 2)}\n`);
          NODE

          cat "$result_file"
          exit "$status"

      - name: Upload bounded compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: s002-harness-mistral-spike-${{ github.sha }}
          path: job/test-results/s002-harness-mistral-spike.json
          if-no-files-found: warn
          retention-days: 3
