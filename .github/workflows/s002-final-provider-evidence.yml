name: S002 Final Provider Evidence

on:
  workflow_dispatch:
  push:
    branches:
      - staging/vxa-s002-agent-led-accounting-seller
    paths:
      - .github/workflows/s002-candidate-gate.yml
      - .github/workflows/s002-final-provider-evidence.yml
      - job/src/server/ai/providers/openai-chat-wire.ts
      - job/tests/pure/provider-wire.node.test.ts
      - job/tools/provider-quality/**
      - job/tools/workshop-spike/run-provider-screen.mjs
      - job/tools/workshop-spike/provider-screen-retry.ts
      - job/tests/pure/provider-screen-retry.node.test.ts
      - job/src/server/ai/providers/chat-sse.ts
      - job/src/server/ai/providers/provider-chat-client.ts
      - job/tests/pure/provider-chat-client.node.test.ts
      - job/src/server/ai/seller/seller-turn-runtime.ts
      - job/src/server/ai/seller/seller-wire-tools.ts
      - job/tests/pure/seller-wire-tools.node.test.ts

permissions:
  contents: read

concurrency:
  group: s002-final-provider-evidence-${{ github.sha }}
  cancel-in-progress: false

jobs:
  provider-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: s002-spike
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: 11.25.0
          runtime: node@24
          package-json-file: job/package.json
          install: false
          cache: false

      - name: Verify exact authority
        shell: bash
        run: |
          set -euo pipefail
          BASE='6244a246d8faf73e772fc944a398a71a02fb97e0a'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e "${BASE}^{commit}"
          git merge-base --is-ancestor "$BASE" HEAD
          test -f job/docs/slices/VXA-S002-contract.md
          grep -Fq 'FORGE-VEXRYZER-AUTOMATION-v1.0.0' job/docs/slices/VXA-S002-contract.md
          grep -Fq 'slice_id: `VXA-S002`' job/docs/slices/VXA-S002-contract.md
          grep -Fq 'slice_version: `1.0.0`' job/docs/slices/VXA-S002-contract.md
          grep -Fq 'GNT-VXA-S002-001' job/docs/slices/VXA-S002-contract.md

      - name: Resolve exact frozen dependencies
        working-directory: job
        run: pnpm install --frozen-lockfile

      - name: Quality harness static verification
        working-directory: job
        run: |
          set -euo pipefail
          pnpm typecheck
          pnpm test:pure

      - name: Verify protected credential presence
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$GROQ_API_KEY"

      - name: Screen exact required provider protocols
        working-directory: job
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p test-results
          node tools/workshop-spike/run-provider-screen.mjs > test-results/s002-provider-screen.json
          node tools/provider-quality/verify-required-provider-protocol.ts             test-results/s002-provider-screen.json             > test-results/s002-required-provider-protocol.json

      - name: Probe exact production streaming tool wire
        working-directory: job
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          node tools/provider-quality/run-product-wire-probe.ts             > test-results/s002-product-wire-probe.json

      - name: Diagnose bounded Seller schema compatibility
        working-directory: job
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node tools/provider-quality/run-seller-schema-diagnostic.ts \
            > test-results/s002-seller-schema-diagnostic.json

      - name: Run accounting Seller and independent Critic quality battery
        working-directory: job
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          node tools/provider-quality/run-s002-provider-quality.ts             > test-results/s002-provider-quality.json

      - name: Reprove exact OpenCode and Groq Workshop tuple
        working-directory: job
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          node tools/workshop-spike/run-opencode-provider.mjs             > test-results/s002-opencode-provider-exact-sha.json

      - name: Prove Cloudflare account has no registered payment method
        if: always()
        working-directory: job
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p test-results
          node tools/provider-quality/run-cloudflare-account-cost-proof.ts \
            > test-results/s002-cloudflare-account-cost.json

      - name: Upload bounded final provider evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: s002-final-provider-evidence-${{ github.sha }}
          path: |
            job/test-results/s002-provider-screen.json
            job/test-results/s002-required-provider-protocol.json
            job/test-results/s002-product-wire-probe.json
            job/test-results/s002-seller-schema-diagnostic.json
            job/test-results/s002-provider-quality.json
            job/test-results/s002-opencode-provider-exact-sha.json
            job/test-results/s002-cloudflare-account-cost.json
          if-no-files-found: warn
          retention-days: 7
