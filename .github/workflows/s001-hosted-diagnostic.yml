# Diagnostic iteration 6: shared credential boundaries plus isolated lockfile capture after hard gates.
name: S001 Hosted Diagnostic

on:
  push:
    branches:
      - slice/vxa-s001-foundation-canvas
    paths:
      - .github/workflows/s001-hosted-diagnostic.yml

permissions:
  contents: read

jobs:
  s001-hosted-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact checkpoint
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Record toolchain
        run: |
          node --version
          pnpm --version
          git rev-parse HEAD

      - name: Resolve dependencies and generate real lockfile
        working-directory: job
        run: pnpm install --no-frozen-lockfile

      - name: Foundation validation
        working-directory: job
        run: pnpm verify:foundation

      - name: TypeScript strict
        working-directory: job
        run: pnpm typecheck

      - name: Pure unit and component tests
        working-directory: job
        run: pnpm test

      - name: Production build
        working-directory: job
        run: pnpm build

      - name: Production bundle provider and secret scan
        working-directory: job
        run: pnpm verify:bundle

      - name: Dependency license inventory
        id: licenses
        continue-on-error: true
        working-directory: job
        run: pnpm licenses list --json > s001-licenses.json

      - name: Production dependency audit
        id: audit
        continue-on-error: true
        working-directory: job
        run: pnpm audit --prod --audit-level high

      - name: Install Chromium for browser GAUNTLET
        working-directory: job
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser E2E accessibility interaction and performance attacks
        working-directory: job
        run: pnpm exec playwright test tests/e2e --output=test-results/e2e

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s001-e2e-${{ github.sha }}
          path: |
            job/test-results/e2e
            job/playwright-report
          if-no-files-found: ignore
          retention-days: 3

      - name: Visual evidence matrix
        working-directory: job
        run: pnpm exec playwright test tests/visual --project=chromium-desktop --output=test-results/visual

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s001-visual-${{ github.sha }}
          path: |
            job/test-results/visual
            job/playwright-report
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload resolved lockfile and dependency inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s001-dependency-resolution-${{ github.sha }}
          path: |
            job/pnpm-lock.yaml
            job/s001-licenses.json
          if-no-files-found: warn
          retention-days: 3

  capture-lockfile:
    needs: s001-hosted-diagnostic
    if: ${{ needs.s001-hosted-diagnostic.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout validated checkpoint
        uses: actions/checkout@v4

      - name: Download dependency artifact only
        uses: actions/download-artifact@v4
        with:
          name: s001-dependency-resolution-${{ github.sha }}
          path: .lock-artifact

      - name: Commit only generated product lockfile
        shell: bash
        run: |
          set -euo pipefail
          test -f .lock-artifact/pnpm-lock.yaml
          cp .lock-artifact/pnpm-lock.yaml job/pnpm-lock.yaml
          git add job/pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'Lockfile already matches validated artifact.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'chore(s001): capture validated pnpm lockfile' \
            -m 'Binding: FORGE-VEXRYZER-AUTOMATION-v1.0.0' \
            -m 'Slice: VXA-S001@1.0.0' \
            -m 'Gauntlet: GNT-VXA-S001-001' \
            -m 'Base: d6a7e1d1994003dff1a9a6871fe1015a049ecdb8'
          git push origin "HEAD:${GITHUB_REF_NAME}"