# Diagnostic iteration 3: source-strict typechecking with vendor declaration boundary aligned to upstream projects.
name: S001 Hosted Diagnostic

on:
  push:
    branches:
      - slice/vxa-s001-foundation-canvas
    paths:
      - .github/workflows/s001-hosted-diagnostic.yml

permissions:
  contents: read

jobs:
  s001-hosted-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact checkpoint
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Record toolchain
        run: |
          node --version
          pnpm --version
          git rev-parse HEAD

      - name: Resolve dependencies and generate real lockfile
        working-directory: job
        run: pnpm install --no-frozen-lockfile

      - name: Foundation validation
        working-directory: job
        run: pnpm verify:foundation

      - name: TypeScript strict
        working-directory: job
        run: pnpm typecheck

      - name: Pure unit and component tests
        working-directory: job
        run: pnpm test

      - name: Production build
        working-directory: job
        run: pnpm build

      - name: Production bundle provider and secret scan
        working-directory: job
        shell: bash
        run: |
          if grep -RniE 'mistral|anthropic|openai|github_pat_|ghp_[A-Za-z0-9]{30,}|sk-[A-Za-z0-9_-]{20,}|VITE_[A-Z0-9_]*(KEY|TOKEN|SECRET)' dist; then
            echo 'Forbidden provider/credential pattern found in production bundle.' >&2
            exit 1
          fi

      - name: Dependency license inventory
        id: licenses
        continue-on-error: true
        working-directory: job
        run: pnpm licenses list --json > s001-licenses.json

      - name: Production dependency audit
        id: audit
        continue-on-error: true
        working-directory: job
        run: pnpm audit --prod --audit-level high

      - name: Install Chromium for browser GAUNTLET
        working-directory: job
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser E2E accessibility interaction and performance attacks
        working-directory: job
        run: pnpm exec playwright test tests/e2e --output=test-results/e2e

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s001-e2e-${{ github.sha }}
          path: |
            job/test-results/e2e
            job/playwright-report
          if-no-files-found: ignore
          retention-days: 3

      - name: Visual evidence matrix
        working-directory: job
        run: pnpm exec playwright test tests/visual --project=chromium-desktop --output=test-results/visual

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s001-visual-${{ github.sha }}
          path: |
            job/test-results/visual
            job/playwright-report
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload resolved lockfile and dependency inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s001-dependency-resolution-${{ github.sha }}
          path: |
            job/pnpm-lock.yaml
            job/s001-licenses.json
          if-no-files-found: warn
          retention-days: 3
