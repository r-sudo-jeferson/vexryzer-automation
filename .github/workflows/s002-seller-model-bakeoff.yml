name: S002 Seller Model Bakeoff

on:
  workflow_dispatch:
  push:
    branches:
      - staging/vxa-s002-agent-led-accounting-seller
    paths:
      - .github/workflows/s002-seller-model-bakeoff.yml
      - job/tools/provider-diagnostics/**
      - job/tests/pure/provider-error-shape.node.test.ts

permissions:
  contents: read

concurrency:
  group: s002-seller-model-bakeoff-${{ github.sha }}
  cancel-in-progress: false

jobs:
  seller-model-bakeoff:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: s002-spike
    steps:
      - name: Checkout exact diagnostic candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: 11.25.0
          runtime: node@24
          package-json-file: job/package.json
          install: false
          cache: false

      - name: Verify exact authority and isolation
        shell: bash
        run: |
          set -euo pipefail
          BASE='6244a246d8faf73e772fc944a398a71a02fb97e0a'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e "${BASE}^{commit}"
          git merge-base --is-ancestor "$BASE" HEAD
          test -f AGENTS.md
          grep -Fq 'FORGE-VEXRYZER-AUTOMATION-v1.0.0' AGENTS.md
          test -f job/docs/slices/VXA-S002-contract.md
          grep -Fq 'VXA-S002' job/docs/slices/VXA-S002-contract.md
          grep -Fq 'GNT-VXA-S002-001' job/docs/slices/VXA-S002-contract.md

      - name: Resolve exact frozen dependencies
        working-directory: job
        run: pnpm install --frozen-lockfile

      - name: Static diagnostic verification
        working-directory: job
        run: |
          set -euo pipefail
          pnpm typecheck
          pnpm test:pure

      - name: Verify protected credential presence
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$GROQ_API_KEY"

      - name: Run bounded Seller model bakeoff and Groq error-shape probe
        working-directory: job
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p test-results
          node tools/provider-diagnostics/run-s002-seller-model-bakeoff.ts             > test-results/s002-seller-model-bakeoff.json

      - name: Upload bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: s002-seller-model-bakeoff-${{ github.sha }}
          path: job/test-results/s002-seller-model-bakeoff.json
          if-no-files-found: warn
          retention-days: 7
