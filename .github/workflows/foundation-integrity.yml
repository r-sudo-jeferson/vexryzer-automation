name: Foundation Integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundation-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Foundation tests
        run: node --test job/tests/foundation/foundation-validator.test.mjs
      - name: Foundation validation
        run: node job/scripts/validate-foundation.mjs
